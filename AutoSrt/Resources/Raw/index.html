<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSrt</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#0B0F19', // Custom darker background
                        },
                        primary: {
                            500: '#6366f1', // Indigo
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F19; /* Fallback */
        }
        /* Custom scrollbar for log area */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5); 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-300 font-sans min-h-screen flex flex-col p-4 md:p-6 select-none">

    <div class="max-w-4xl mx-auto w-full flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex items-center justify-between pb-2 border-b border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-closed-captioning text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">AutoSrt</h1>
                    <p class="text-xs text-gray-500 font-medium">智能字幕生成代理</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-xs text-green-500 font-mono">SYSTEM READY</span>
            </div>
        </header>

        <!-- Banner -->
        <div class="glass-panel rounded-xl p-4 border border-indigo-500/20">
            <div class="flex items-start gap-3">
                <div class="mt-0.5 text-indigo-400">
                    <i class="fa-solid fa-circle-info"></i>
                </div>
                <div class="text-sm leading-relaxed text-gray-300">
                    <span class="font-semibold text-white">强烈建议使用 qwen3-next-80B-A3B</span>，获得速度和性能的最佳平衡，gpt-oss-120b 可能会消耗更多时间。90分钟电影的字幕 qwen3-next-80B-A3B 模型耗时 7-9 分钟，而 gpt-oss-120b 则会消耗 5 倍的时间，两者消耗的费用大概是 gpt-oss-120b ~0.1 美元 / qwen3-next-80b-a3b ~0.05 美元。
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Configuration -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- LLM Settings -->
                <div class="glass-panel rounded-2xl p-5 shadow-xl">
                    <div class="flex items-center gap-2 mb-4 text-white">
                        <i class="fa-solid fa-robot text-indigo-400"></i>
                        <h2 class="font-semibold text-sm uppercase tracking-wider">LLM 配置</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="group">
                            <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1 transition-colors group-hover:text-indigo-400">Endpoint</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-network-wired text-gray-600 text-xs"></i>
                                </div>
                                <input type="text" id="endpoint" 
                                    class="w-full bg-gray-900/50 text-gray-200 text-sm rounded-lg border border-gray-700/50 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 block pl-9 p-2.5 transition-all outline-none placeholder-gray-700"
                                    placeholder="https://openrouter.ai/api/v1/{1}" 
                                    value="https://openrouter.ai/api/v1/{1}">
                            </div>
                        </div>
                        
                        <div class="group">
                            <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1 transition-colors group-hover:text-indigo-400">API Key</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-key text-gray-600 text-xs"></i>
                                </div>
                                <input type="password" id="apiKey" 
                                    class="w-full bg-gray-900/50 text-gray-200 text-sm rounded-lg border border-gray-700/50 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 block pl-9 p-2.5 transition-all outline-none placeholder-gray-700"
                                    placeholder="sk-..." >
                            </div>
                        </div>
                        
                        <div class="group">
                            <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1 transition-colors group-hover:text-indigo-400">Model Name</label>
                            <div id="modelComboBox" class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-brain text-gray-600 text-xs"></i>
                                </div>
                                <input type="text" id="model" autocomplete="off"
                                    role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="modelOptions"
                                    class="w-full bg-gray-900/50 text-gray-200 text-sm rounded-lg border border-gray-700/50 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 block pl-9 pr-9 p-2.5 transition-all outline-none"
                                    placeholder="输入或选择模型名称"
                                    value="qwen/qwen3-next-80b-a3b-instruct">
                                <button type="button" id="modelDropdownButton" aria-label="展开模型列表"
                                    class="absolute inset-y-0 right-0 px-3 flex items-center rounded-r-lg text-gray-600 hover:text-indigo-400 focus:text-indigo-400 outline-none"
                                    onclick="toggleModelDropdown()">
                                    <i class="fa-solid fa-chevron-down text-gray-600 text-xs"></i>
                                </button>
                                <div id="modelOptions" role="listbox"
                                    class="hidden absolute z-50 left-0 right-0 top-full mt-1 max-h-52 overflow-y-auto custom-scrollbar rounded-lg border border-gray-700 bg-gray-900 shadow-2xl py-1">
                                    <button type="button" role="option" data-model="qwen/qwen3-next-80b-a3b-instruct" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">qwen/qwen3-next-80b-a3b-instruct</button>
                                    <button type="button" role="option" data-model="qwen/qwen3.5-397b-a17b" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">qwen/qwen3.5-397b-a17b</button>
                                    <button type="button" role="option" data-model="openai/gpt-oss-120b" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">openai/gpt-oss-120b</button>
                                    <button type="button" role="option" data-model="openai/gpt-oss-20b" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">openai/gpt-oss-20b</button>
                                    <button type="button" role="option" data-model="openai/gpt-5.3-codex" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">openai/gpt-5.3-codex</button>
                                    <button type="button" role="option" data-model="google/gemini-3.1-pro-preview" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">google/gemini-3.1-pro-preview</button>
                                    <button type="button" role="option" data-model="anthropic/claude-opus-4.6" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">anthropic/claude-opus-4.6</button>
                                    <button type="button" role="option" data-model="deepseek-v3.2" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">deepseek-v3.2</button>
                                    <button type="button" role="option" data-model="glm-5" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">glm-5</button>
                                    <button type="button" role="option" data-model="kimi-k2.5" class="model-option w-full px-3 py-2 text-left text-xs text-gray-300 hover:bg-indigo-500/20 hover:text-white">kimi-k2.5</button>
                                    <div id="modelNoResults" class="hidden px-3 py-2 text-xs text-gray-500">没有匹配项，可直接使用输入的模型名称</div>
                                </div>
                            </div>
                        </div>

                        <div class="group">
                            <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1 transition-colors group-hover:text-indigo-400">Target Language</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-language text-gray-600 text-xs"></i>
                                </div>
                                <select id="targetLanguage"
                                    class="w-full bg-gray-900/50 text-gray-200 text-sm rounded-lg border border-gray-700/50 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 block pl-9 pr-9 p-2.5 transition-all outline-none appearance-none">
                                    <option value="简体中文" selected>简体中文</option>
                                    <option value="繁体中文">繁体中文</option>
                                    <option value="English">English</option>
                                    <option value="日文">日文</option>
                                    <option value="韩文">韩文</option>
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-gray-600 text-xs"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Video Selection -->
                <div class="glass-panel rounded-2xl p-5 shadow-xl">
                    <div class="flex items-center gap-2 mb-4 text-white">
                        <i class="fa-solid fa-film text-indigo-400"></i>
                        <h2 class="font-semibold text-sm uppercase tracking-wider">媒体源</h2>
                    </div>

                    <div class="space-y-4">
                        <div class="relative group cursor-pointer" onclick="selectVideo()">
                            <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg opacity-30 group-hover:opacity-100 transition duration-300 blur-sm"></div>
                            <div class="relative flex items-center gap-3 bg-gray-800 hover:bg-gray-750 p-3 rounded-lg border border-gray-700 transition-colors">
                                <div class="bg-gray-700 p-2 rounded-md">
                                    <i class="fa-solid fa-folder-open text-indigo-400"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-gray-400 mb-0.5">选择视频文件</p>
                                    <p id="selectedVideoPath" class="text-sm text-gray-200 font-medium truncate">未选择文件</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-gray-600"></i>
                            </div>
                        </div>
                        
                        <button id="runButton" onclick="startProcess()" class="w-full group relative overflow-hidden rounded-lg bg-indigo-600 p-3 text-center font-medium text-white shadow-lg transition-all hover:bg-indigo-500 hover:shadow-indigo-500/40 focus:ring-4 focus:ring-indigo-500/20 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-indigo-600">
                             <span class="relative flex items-center justify-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>开始处理</span>
                            </span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Logs / Terminal -->
            <div class="lg:col-span-2 flex flex-col h-[500px] lg:h-auto glass-panel rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-gray-900/80 p-3 border-b border-gray-800 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-gray-500 text-xs"></i>
                        <span class="text-xs font-mono text-gray-400">OUTPUT LOGS</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <div class="w-2.5 h-2.5 rounded-full bg-red-500/20 border border-red-500/50"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-green-500/20 border border-green-500/50"></div>
                    </div>
                </div>
                
                <div class="flex-1 bg-gray-950/50 relative">
                    <div id="logContainer" class="absolute inset-0 p-4 font-mono text-xs overflow-y-auto custom-scrollbar space-y-2 text-gray-300">
                        <div class="log-entry text-gray-500 italic border-l-2 border-gray-700 pl-2">
                            等待任务开始...
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Logic -->
    <script>
        const modelComboBox = document.getElementById('modelComboBox');
        const modelInput = document.getElementById('model');
        const modelOptions = document.getElementById('modelOptions');
        const modelNoResults = document.getElementById('modelNoResults');

        function setModelDropdownOpen(open) {
            modelOptions.classList.toggle('hidden', !open);
            modelInput.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        function filterModelOptions() {
            const filter = modelInput.value.trim().toLowerCase();
            let visibleCount = 0;

            document.querySelectorAll('.model-option').forEach(option => {
                const visible = !filter || option.dataset.model.toLowerCase().includes(filter);
                option.classList.toggle('hidden', !visible);
                if (visible) visibleCount++;
            });

            modelNoResults.classList.toggle('hidden', visibleCount !== 0);
        }

        function toggleModelDropdown() {
            const opening = modelOptions.classList.contains('hidden');
            if (opening) filterModelOptions();
            setModelDropdownOpen(opening);
            modelInput.focus();
        }

        document.querySelectorAll('.model-option').forEach(option => {
            option.addEventListener('click', () => {
                modelInput.value = option.dataset.model;
                setModelDropdownOpen(false);
                modelInput.focus();
            });
        });

        modelInput.addEventListener('input', () => {
            filterModelOptions();
            setModelDropdownOpen(true);
        });

        modelInput.addEventListener('keydown', event => {
            if (event.key === 'Escape') setModelDropdownOpen(false);
            if (event.key === 'ArrowDown') {
                event.preventDefault();
                setModelDropdownOpen(true);
                document.querySelector('.model-option:not(.hidden)')?.focus();
            }
        });

        document.addEventListener('click', event => {
            if (!modelComboBox.contains(event.target)) setModelDropdownOpen(false);
        });

        function selectVideo() {
            window.location.href = 'autosrt://pickVideo';
        }

        function setVideoPath(path) {
            const el = document.getElementById('selectedVideoPath');
            if(path) {
                el.innerText = path;
                el.classList.add('text-indigo-300');
                el.classList.remove('text-gray-200');
            } else {
                el.innerText = '未选择文件';
                el.classList.add('text-gray-200');
                el.classList.remove('text-indigo-300');
            }
        }

        function startProcess() {
            const endpoint = document.getElementById('endpoint').value;
            const apiKey = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            const targetLanguage = document.getElementById('targetLanguage').value;
            
            const payload = JSON.stringify({
                endpoint: endpoint,
                apiKey: apiKey,
                model: model,
                targetLanguage: targetLanguage
            });

            window.location.href = 'autosrt://run?payload=' + encodeURIComponent(payload);
        }

        function setProcessing(isProcessing) {
            const btn = document.getElementById('runButton');
            const icon = btn.querySelector('i');
            const text = btn.querySelector('span > span:last-child');
            
            if (isProcessing) {
                btn.disabled = true;
                icon.className = 'fa-solid fa-circle-notch fa-spin';
                text.innerText = '正在处理...';
            } else {
                btn.disabled = false;
                icon.className = 'fa-solid fa-wand-magic-sparkles';
                text.innerText = '开始处理';
            }
        }

        function appendLog(message) {
            const container = document.getElementById('logContainer');
            
            // Format time
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0') + ':' + 
                            now.getSeconds().toString().padStart(2, '0');

            const div = document.createElement('div');
            div.className = 'log-entry flex gap-2 animate-[fadeIn_0.3s_ease-out]';
            
            // Simple coloring logic based on keywords
            let contentColor = 'text-gray-300';
            let borderClass = 'border-l-2 border-gray-700';
            
            if (message.toLowerCase().includes('error') || message.toLowerCase().includes('失败')) {
                contentColor = 'text-red-400';
                borderClass = 'border-l-2 border-red-500';
            } else if (message.toLowerCase().includes('warn') || message.toLowerCase().includes('警告')) {
                contentColor = 'text-yellow-400';
                borderClass = 'border-l-2 border-yellow-500';
            } else if (message.toLowerCase().includes('success') || message.toLowerCase().includes('完成')) {
                contentColor = 'text-green-400';
                borderClass = 'border-l-2 border-green-500';
            }

            div.innerHTML = `
                <span class="text-gray-600 select-none">[${timeStr}]</span>
                <span class="${contentColor} ${borderClass} pl-2 flex-1 break-all">${message}</span>
            `;
            
            container.appendChild(div);
            
            // Auto scroll
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
        }
    </script>
</body>
</html>
